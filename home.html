<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইবার সিকিউরিটি একাডেমি BD</title>
    <style>
        :root {
            --bg-dark: #0a0f1d;
            --bg-card: #111827;
            --bg-card-hover: #1f2937;
            --cyber-green: #00ff66;
            --cyber-cyan: #00f0ff;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #1f2937;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        nav {
            background-color: rgba(17, 24, 39, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--cyber-green);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.3s;
        }

        .nav-link:hover {
            color: var(--cyber-green);
        }

        .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background-color: var(--cyber-green);
            color: #000;
        }

        .btn-primary:hover {
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--cyber-green);
            color: var(--cyber-green);
        }

        .btn-outline:hover {
            background: var(--cyber-green);
            color: #000;
        }

        .btn-danger {
            background-color: var(--danger);
            color: white;
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 3rem 1rem;
            background: linear-gradient(180deg, rgba(0,255,102,0.05) 0%, rgba(0,0,0,0) 100%);
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto 1.5rem;
        }

        /* Course Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--cyber-green);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-body {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .badge {
            background-color: rgba(0, 240, 255, 0.1);
            color: var(--cyber-cyan);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.8rem;
            width: fit-content;
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .card-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1rem;
            flex: 1;
        }

        .card-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--cyber-green);
            margin-bottom: 1rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--cyber-green);
        }

        /* Table Styles for Admin/Dashboard */
        .table-container {
            overflow-x: auto;
            margin-top: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--cyber-green);
        }

        /* Footer */
        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="nav-container">
            <div class="logo" onclick="showView('home')">
                🛡️ সাইবার সিকিউরিটি একাডেমি
            </div>
            <div class="nav-links" id="navLinks">
                <!-- Dynamic Links Handled by JS -->
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app">
        <!-- Dynamic Views Will Render Here -->
    </main>

    <!-- Modal Container -->
    <div id="modal" class="modal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 সাইবার সিকিউরিটি একাডেমি BD - সর্বস্বত্ব সংরক্ষিত।
    </footer>

    <script>
        // State Management
        const defaultCourses = [
            {
                id: '1',
                title: 'কমপ্লিট ইথিক্যাল হ্যাকিং মাস্টারক্লাস',
                category: 'Ethical Hacking',
                price: 2500,
                desc: 'শূন্য থেকে প্রফেশনাল ইথিক্যাল হ্যাকিং শিখুন সম্পূর্ণ প্র্যাকটিক্যাল ল্যাবের সাথে।',
                image: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=500&q=80'
            },
            {
                id: '2',
                title: 'ওয়েব পেনিট্রেশন টেস্টিং ও বাগ বাউন্টি',
                category: 'Web Security',
                price: 3000,
                desc: 'ওয়েব অ্যাপ্লিকেশনের নিরাপত্তা ত্রুটি খুঁজে বের করুন এবং বাগ বাউন্টি শুরু করুন।',
                image: 'https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=500&q=80'
            },
            {
                id: '3',
                title: 'নেটওয়ার্ক সিকিউরিটি ফান্ডামেন্টালস',
                category: 'Network',
                price: 2000,
                desc: 'নেটওয়ার্ক আর্কিটেকচার, ফায়ারওয়াল এবং সিকিউরিটি অডিটিং শিখুন।',
                image: 'https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=500&q=80'
            }
        ];

        let courses = JSON.parse(localStorage.getItem('csa_courses')) || defaultCourses;
        let users = JSON.parse(localStorage.getItem('csa_users')) || [];
        let payments = JSON.parse(localStorage.getItem('csa_payments')) || [];
        let currentUser = JSON.parse(localStorage.getItem('csa_current_user')) || null;

        function saveData() {
            localStorage.setItem('csa_courses', JSON.stringify(courses));
            localStorage.setItem('csa_users', JSON.stringify(users));
            localStorage.setItem('csa_payments', JSON.stringify(payments));
            localStorage.setItem('csa_current_user', JSON.stringify(currentUser));
        }

        // Navigation Render
        function renderNav() {
            const navLinks = document.getElementById('navLinks');
            let html = `<span class="nav-link" onclick="showView('home')">হোম</span>`;

            if (currentUser) {
                if (currentUser.role === 'admin') {
                    html += `
                        <span class="nav-link" onclick="showView('admin')">এডমিন ড্যাশবোর্ড</span>
                        <button class="btn btn-outline" onclick="logout()">লগআউট</button>
                    `;
                } else {
                    html += `
                        <span class="nav-link" onclick="showView('student')">মাই ড্যাশবোর্ড</span>
                        <button class="btn btn-outline" onclick="logout()">লগআউট (${currentUser.name})</button>
                    `;
                }
            } else {
                html += `
                    <button class="btn btn-outline" onclick="showLoginModal()">লগইন</button>
                    <button class="btn btn-primary" onclick="showRegisterModal()">সাইন আপ</button>
                    <button class="btn btn-outline" style="border-color:#666; color:#aaa" onclick="promptAdminLogin()">এডমিন</button>
                `;
            }
            navLinks.innerHTML = html;
        }

        // Router / Views
        function showView(view, param = null) {
            const app = document.getElementById('app');
            renderNav();

            if (view === 'home') {
                app.innerHTML = `
                    <div class="hero">
                        <h1>আপনার সাইবার সিকিউরিটি ক্যারিয়ার শুরু হোক এখান থেকেই</h1>
                        <p>ইথিক্যাল হ্যাকিং, ওয়েব সিকিউরিটি এবং নেটওয়ার্ক ডিফেন্স শিখুন ১০০% প্র্যাকটিক্যাল ল্যাব ও রিয়েল ওয়ার্ল্ড প্রজেক্টের সাথে।</p>
                    </div>
                    <h2>আমাদের জনপ্রিয় কোর্সসমূহ</h2>
                    <div class="grid">
                        ${courses.map(c => `
                            <div class="card">
                                <img src="${c.image}" class="card-img" alt="${c.title}">
                                <div class="card-body">
                                    <span class="badge">${c.category}</span>
                                    <h3 class="card-title">${c.title}</h3>
                                    <p class="card-text">${c.desc}</p>
                                    <div class="card-price">৳ ${c.price}</div>
                                    <button class="btn btn-primary" onclick="buyCourse('${c.id}')">কোর্সটি কিনুন</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (view === 'student') {
                if (!currentUser || currentUser.role !== 'student') return showView('home');

                const myPayments = payments.filter(p => p.userId === currentUser.email);
                const approvedCourseIds = myPayments.filter(p => p.status === 'Approved').map(p => p.courseId);
                const myCourses = courses.filter(c => approvedCourseIds.includes(c.id));

                app.innerHTML = `
                    <h2>স্বাগতম, ${currentUser.name}!</h2>
                    <p style="color:var(--text-muted); margin-bottom:2rem;">আপনার স্টুডেন্ট ড্যাশবোর্ড থেকে অর্জিত কোর্সগুলো অ্যাক্সেস করুন।</p>
                    
                    <h3>আমার কোর্সসমূহ (${myCourses.length})</h3>
                    <div class="grid" style="margin-bottom:3rem;">
                        ${myCourses.length === 0 ? '<p style="color:var(--text-muted)">আপনি এখনো কোনো কোর্স এনরোল করেননি।</p>' : ''}
                        ${myCourses.map(c => `
                            <div class="card">
                                <img src="${c.image}" class="card-img">
                                <div class="card-body">
                                    <h3 class="card-title">${c.title}</h3>
                                    <button class="btn btn-primary" onclick="alert('কোর্স কন্টেন্ট শীঘ্রই আসবে!')">ক্লাস শুরু করুন</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <h3>পেমেন্ট হিস্ট্রি</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>কোর্স ID</th>
                                    <th>মেথড</th>
                                    <th>TrxID</th>
                                    <th>স্ট্যাটাস</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${myPayments.map(p => `
                                    <tr>
                                        <td>${p.courseTitle}</td>
                                        <td>${p.method}</td>
                                        <td>${p.trxId}</td>
                                        <td><span style="color:${p.status === 'Approved' ? 'var(--cyber-green)' : 'orange'}">${p.status}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } else if (view === 'admin') {
                if (!currentUser || currentUser.role !== 'admin') return showView('home');

                app.innerHTML = `
                    <div style="display:flex; justify-between; align-items:center; margin-bottom:1.5rem;">
                        <h2>এডমিন কন্ট্রোল প্যানেল</h2>
                        <button class="btn btn-primary" onclick="showAddCourseModal()">+ নতুন কোর্স যোগ করুন</button>
                    </div>

                    <h3>সকল কোর্স ব্যবস্থাপনা (${courses.length})</h3>
                    <div class="table-container" style="margin-bottom:3rem;">
                        <table>
                            <thead>
                                <tr>
                                    <th>শিরোনাম</th>
                                    <th>ক্যাটাগরি</th>
                                    <th>মূল্য</th>
                                    <th>অ্যাকশন</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${courses.map(c => `
                                    <tr>
                                        <td>${c.title}</td>
                                        <td>${c.category}</td>
                                        <td>৳ ${c.price}</td>
                                        <td>
                                            <button class="btn btn-danger" onclick="deleteCourse('${c.id}')">ডিলিট</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <h3>পেন্ডিং পেমেন্ট রিকোয়েস্ট (${payments.filter(p => p.status === 'Pending').length})</h3>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>শিক্ষার্থী</th>
                                    <th>কোর্স</th>
                                    <th>মেথড</th>
                                    <th>TrxID</th>
                                    <th>অ্যাকশন</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${payments.filter(p => p.status === 'Pending').map(p => `
                                    <tr>
                                        <td>${p.userId}</td>
                                        <td>${p.courseTitle}</td>
                                        <td>${p.method}</td>
                                        <td>${p.trxId}</td>
                                        <td>
                                            <button class="btn btn-primary" onclick="approvePayment('${p.id}')">অ্যাপ্রুভ</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }
        }

        // Modals & Authentication
        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function showLoginModal() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h3 style="margin-bottom:1rem;">স্টুডেন্ট লগইন</h3>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>ইমেইল</label>
                        <input type="email" id="loginEmail" required>
                    </div>
                    <div class="form-group">
                        <label>পাসওয়ার্ড</label>
                        <input type="password" id="loginPass" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">লগইন করুন</button>
                </form>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function showRegisterModal() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h3 style="margin-bottom:1rem;">নতুন অ্যাকাউন্ট খুলুন</h3>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>নাম</label>
                        <input type="text" id="regName" required>
                    </div>
                    <div class="form-group">
                        <label>ইমেইল</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>পাসওয়ার্ড</label>
                        <input type="password" id="regPass" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">সাইন আপ</button>
                </form>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function promptAdminLogin() {
            const pass = prompt('এডমিন পাসওয়ার্ড দিন:');
            if (pass === 'admin123') {
                currentUser = { name: 'Admin', email: 'admin@academy.bd', role: 'admin' };
                saveData();
                showView('admin');
            } else if (pass !== null) {
                alert('ভুল পাসওয়ার্ড!');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;

            if (users.find(u => u.email === email)) {
                alert('এই ইমেইল দিয়ে ইতোমধ্যে অ্যাকাউন্ট আছে!');
                return;
            }

            const newUser = { name, email, pass, role: 'student' };
            users.push(newUser);
            currentUser = newUser;
            saveData();
            closeModal();
            showView('student');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPass').value;

            const user = users.find(u => u.email === email && u.pass === pass);
            if (user) {
                currentUser = user;
                saveData();
                closeModal();
                showView('student');
            } else {
                alert('ইমেইল বা পাসওয়ার্ড ভুল হয়েছে!');
            }
        }

        function logout() {
            currentUser = null;
            saveData();
            showView('home');
        }

        // Actions
        function buyCourse(courseId) {
            if (!currentUser) {
                alert('কোর্স কিনতে প্রথমে লগইন করুন!');
                return showLoginModal();
            }

            const course = courses.find(c => c.id === courseId);
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h3>কোর্স পেমেন্ট - ${course.title}</h3>
                <p style="margin:1rem 0; color:var(--cyber-green)">মূল্য: ৳ ${course.price}</p>
                <div style="background:var(--bg-dark); padding:1rem; border-radius:6px; margin-bottom:1rem; font-size:0.9rem;">
                    <strong>পেমেন্ট ইনস্ট্রাকশন:</strong><br>
                    বিকাশ/নগদ সেন্ড মানি করুন: <strong>01700000000</strong> নম্বর এ। টাকা পাঠিয়ে Transaction ID নিচে দিন।
                </div>
                <form onsubmit="submitPayment(event, '${course.id}', '${course.title}')">
                    <div class="form-group">
                        <label>পেমেন্ট মেথড</label>
                        <select id="payMethod">
                            <option value="bKash">bKash</option>
                            <option value="Nagad">Nagad</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Transaction ID (TrxID)</label>
                        <input type="text" id="payTrx" placeholder="e.g. 9J82KS01" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">পেমেন্ট সাবমিট করুন</button>
                </form>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function submitPayment(e, courseId, courseTitle) {
            e.preventDefault();
            const method = document.getElementById('payMethod').value;
            const trxId = document.getElementById('payTrx').value;

            payments.push({
                id: Date.now().toString(),
                userId: currentUser.email,
                courseId,
                courseTitle,
                method,
                trxId,
                status: 'Pending'
            });

            saveData();
            closeModal();
            alert('পেমেন্ট রিকোয়েস্ট জমা হয়েছে! এডমিন ভেরিফাই করলে কোর্স সচল হবে।');
            showView('student');
        }

        function approvePayment(payId) {
            const pay = payments.find(p => p.id === payId);
            if (pay) {
                pay.status = 'Approved';
                saveData();
                showView('admin');
            }
        }

        function showAddCourseModal() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = `
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h3>নতুন কোর্স যোগ করুন</h3>
                <form onsubmit="handleAddCourse(event)">
                    <div class="form-group">
                        <label>কোর্সের নাম</label>
                        <input type="text" id="cTitle" required>
                    </div>
                    <div class="form-group">
                        <label>ক্যাটাগরি</label>
                        <input type="text" id="cCat" placeholder="e.g. Ethical Hacking" required>
                    </div>
                    <div class="form-group">
                        <label>মূল্য (টাকা)</label>
                        <input type="number" id="cPrice" required>
                    </div>
                    <div class="form-group">
                        <label>ইমেজ URL</label>
                        <input type="url" id="cImg" required>
                    </div>
                    <div class="form-group">
                        <label>সংক্ষিপ্ত বিবরণ</label>
                        <textarea id="cDesc" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%">পাবলিশ করুন</button>
                </form>
            `;
            document.getElementById('modal').style.display = 'flex';
        }

        function handleAddCourse(e) {
            e.preventDefault();
            const newCourse = {
                id: Date.now().toString(),
                title: document.getElementById('cTitle').value,
                category: document.getElementById('cCat').value,
                price: Number(document.getElementById('cPrice').value),
                image: document.getElementById('cImg').value,
                desc: document.getElementById('cDesc').value
            };

            courses.push(newCourse);
            saveData();
            closeModal();
            showView('admin');
        }

        function deleteCourse(courseId) {
            if (confirm('আপনি কি সত্যিই এই কোর্সটি মুছে ফেলতে চান?')) {
                courses = courses.filter(c => c.id !== courseId);
                saveData();
                showView('admin');
            }
        }

        // Init App
        showView('home');
    </script>
</body>
</html>
